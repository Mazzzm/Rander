<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#111827">
    <meta name="description" content="Rander - متجرك الإلكتروني">

    <title>Rander | متجرك الإلكتروني</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: #f5f6f8;
            color: #111827;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .cart {
            background: white;
            color: #111827;
            border: none;
            border-radius: 12px;
            padding: 10px 15px;
            font-size: 15px;
            cursor: pointer;
        }

        .hero {
            background: white;
            padding: 55px 25px;
            text-align: center;
        }

        .hero h1 {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .hero p {
            color: #6b7280;
            font-size: 17px;
            line-height: 1.8;
        }

        .products-section {
            padding: 30px 18px 60px;
            max-width: 1100px;
            margin: auto;
        }

        .section-title {
            font-size: 25px;
            margin-bottom: 22px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 18px;
        }

        .product {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .product-image {
            height: 180px;
            background: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            font-size: 14px;
        }

        .product-info {
            padding: 16px;
        }

        .product-name {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .price {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 14px;
        }

        .buy-button {
            width: 100%;
            border: none;
            background: #25D366; /* لون الواتساب الأخضر */
            color: white;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        footer {
            background: #111827;
            color: #d1d5db;
            text-align: center;
            padding: 25px;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            .hero h1 {
                font-size: 31px;
            }

            .products {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .product-image {
                height: 140px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">RANDER</div>

    <button class="cart">
        🛒 السلة <span id="cart-count">0</span>
    </button>
</header>

<section class="hero">
    <h1>مرحبًا بك في Rander</h1>

    <p>
        اكتشف منتجاتنا واختر ما يناسبك
        <br>
        تسوق بسهولة من هاتفك
    </p>
</section>

<section class="products-section">

    <h2 class="section-title">منتجاتنا</h2>

    <div class="products">

        <!-- المنتج 1 -->
        <div class="product">
            <div class="product-image">
                صورة المنتج
            </div>
            <div class="product-info">
                <div class="product-name">
                    المنتج الأول
                </div>
                <div class="price">
                    25,000 د.ع
                </div>
                <button class="buy-button" onclick="sendOrder('المنتج الأول', '25,000 د.ع')">
                    اطلب عبر واتساب 💬
                </button>
            </div>
        </div>

        <!-- المنتج 2 -->
        <div class="product">
            <div class="product-image">
                 <img src="3D270FAF-2572-44F4-8147-45CE965BC0A5.jpeg" style="width:100%; height:100%; object-fit:cover;">

            </div>
            <div class="product-info">
                <div class="product-name">
                    المنتج الثاني
                </div>
                <div class="price">
                    30,000 د.ع
                </div>
                <button class="buy-button" onclick="sendOrder('المنتج الثاني', '30,000 د.ع')">
                    اطلب عبر واتساب 💬
                </button>
            </div>
        </div>

        <!-- المنتج 3 -->
        <div class="product">
            <div class="product-image">
                <img src="https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=500" alt="كوب قهوة" style="width:100%; height:100%; object-fit:cover;">
            </div>
            <div class="product-info">
                <div class="product-name">
                    كوب قهوة (But First, Coffee ☕)
                </div>
                <div class="price">
                    12,000 د.ع
                </div>
                <button class="buy-button" onclick="sendOrder('كوب قهوة', '12,000 د.ع')">
                    اطلب عبر واتساب 💬
                </button>
            </div>
        </div>

    </div>

</section>

<footer>
    © 2026 Rander — جميع الحقوق محفوظة
</footer>

<script>
    // ⚠️ ضع رقم هاتفك مع مفتاح الدولة هنا بدلاً من الرقم الموجود
    // مثال للعراق: 9647700000000
    const myPhoneNumber = "9647862253180"; 

    function sendOrder(productName, price) {
        // نص الرسالة التي ستصلك على الواتساب
        const message = `مرحباً، أريد طلب المنتج التالي:%0A- المنتج: ${productName}%0A- السعر: ${price}`;
        
        // فتح الواتساب مباشرة
        const whatsappUrl = `https://wa.me/${myPhoneNumber}?text=${message}`;
        window.open(whatsappUrl, '_blank');
    }
</script>

</body>
</html>
